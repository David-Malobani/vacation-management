# PostgreSQL for local development.
#   docker compose up -d db
# If a local Postgres already uses 5432, run with POSTGRES_HOST_PORT=5433 and set DB_PORT=5433 in server/.env.
services:
  db:
    image: postgres:16-alpine
    container_name: vacation-management-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vacation_management
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vacation_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
